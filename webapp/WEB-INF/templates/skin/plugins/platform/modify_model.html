<#ftl output_format="HTML">
<#include "commons/page_header_model.html">

 <form method="post" action="jsp/site/Portal.jsp">
 <input type="hidden" name="page" value="agent_model">
 <input type="hidden" name="action" value="doModifyModel">
 <input type="hidden" name="model_id" value="${model.id}">
 <input type="hidden" name="client_id" value="${model.clientId!}">

 <div class="card">
 <div class="card-body">
 <h5 class="fw-bold mb-3"><i class="ti ti-settings me-2"></i>#i18n{platform.agent.create_model.general_info}</h5>
 <div class="mb-3">
 <label for="provider_id" class="form-label">#i18n{platform.agent.model.entity.model.attribute.providerId} *</label>
 <select class="form-select" data-mu-toggle="select" id="provider_id" name="provider_id" required>
 <#if providers?? && providers?size gt 0>
 <#list providers as provider>
 <option value="${provider.id}" <#if model.providerId == provider.id>selected</#if>>${provider.providerName!} (${provider.providerType!})</option>
 </#list>
 <#else>
 <option value="">-- #i18n{platform.agent.create_model.noProviders} --</option>
 </#if>
 </select>
 <div class="form-text">#i18n{platform.agent.modify_model.providerHelp}</div>
 </div>
 </div>
 </div>

 <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
 <a href="jsp/site/Portal.jsp?page=platform&view=viewClient&id=${model.clientId!}" class="btn btn-light">
 #i18n{platform.agent.xpage.action.cancel}
 </a>
 <#if model.userCanModify!false>
 <button type="submit" class="btn btn-primary">
 <i class="ti ti-device-floppy me-1"></i>#i18n{platform.agent.xpage.action.save}
 </button>
 </#if>
 </div>
 </form>
