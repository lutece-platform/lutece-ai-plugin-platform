# platform.properties - Configuration simplifiée

# Default Labels for XPage platform
platform.pageTitle=platform
platform.pagePathLabel=platform


platform.telemetry.enabled=false
platform.telemetry.service.name=lutece-platform
platform.telemetry.otlp.endpoint=http://localhost:4317
platform.telemetry.sampling.ratio=1.0

# =====================================
# Configuration Elasticsearch Platform
# =====================================
platform.agent.elasticsearch.host=localhost
platform.agent.elasticsearch.port=9200
platform.agent.elasticsearch.protocol=http
platform.agent.elasticsearch.username=
platform.agent.elasticsearch.password=

# ===========================
# Configuration Redis Platform
# ===========================
platform.agent.redis.host=localhost
platform.agent.redis.port=6376
platform.agent.redis.password=
platform.agent.redis.timeout=2000

# ======================
# Configuration SSE
# ======================
platform.agent.sse.max.concurrent.streams.global=100
platform.agent.sse.max.concurrent.streams.per.client.user=1

# ===========================
# Configuration GitLab Pipeline
# ===========================
pipelines.gitlab.api.url=
pipelines.gitlab.token=

# ================================
# Configuration Elasticsearch Pipeline
# ================================
pipelines.elasticsearch.host=localhost
pipelines.elasticsearch.port=9200
pipelines.elasticsearch.protocol=http
pipelines.elasticsearch.username=
pipelines.elasticsearch.password=

# =======================
# Configuration Proxy
# =======================
pipelines.proxy.host=
pipelines.proxy.port=

# =======================
# Configuration MinIO
# =======================
pipelines.minio.endpoint=
pipelines.minio.login=
pipelines.minio.password=

# ============================
# Configuration Redis Pipeline
# ============================
pipelines.redis.host=localhost
pipelines.redis.port=6379
pipelines.redis.password=password
pipelines.redis.timeout=2000
pipelines.redis.pool.maxTotal=50
pipelines.redis.pool.maxIdle=10

# ========================
# Configuration des jobs pipeline
# ========================
# Nombre de pipelines exécutés simultanément (global). À aligner sur le max du pool @Orchestration (server.xml).
pipelines.maxActiveJobs=16
# Taille max de la file de jobs en attente (PENDING) ; au-delà, nouvelle soumission rejetée en 503.
pipelines.maxPendingJobs=1000

# ================================
# Configuration Model Proxy
# ================================
platform.agent.model.proxy.enabled=false
platform.agent.model.proxy.host=192.168.64.41
platform.agent.model.proxy.port=8080
platform.agent.model.proxy.type=HTTP
platform.agent.model.proxy.username=
platform.agent.model.proxy.password=

# ========================================
# Configuration Daemon Rate Limit Cleanup
# ========================================
daemon.botRateLimitCleanupDaemon.interval=3600
daemon.botRateLimitCleanupDaemon.onstartup=0
